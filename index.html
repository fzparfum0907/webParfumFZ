<style>
:root{
  --bg:#F5EFF2;--card:#FFFFFF;--ink:#2A1430;--soft:#6E5A74;--line:#E2D6E0;
  --brass:#9A6B1E;--rose:#8E3B5C;--btn:#1F7A4D;--btnt:#FFFFFF;
  --c-dis:#8E3B5C;--c-nic:#2F4A6B;--c-ara:#9A6B1E;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1022;--card:#2A1A30;--ink:#F3E9F1;--soft:#BBA6C2;--line:#43304A;
  --brass:#D9AE62;--rose:#E08CAD;--btn:#2E9E68;
  --c-dis:#E08CAD;--c-nic:#8FB2DE;--c-ara:#D9AE62;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#1D1022;--card:#2A1A30;--ink:#F3E9F1;--soft:#BBA6C2;--line:#43304A;--brass:#D9AE62;--rose:#E08CAD;--btn:#2E9E68;--c-dis:#E08CAD;--c-nic:#8FB2DE;--c-ara:#D9AE62;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{padding:56px 0 28px;border-bottom:1px solid var(--line)}
h1{font-family:"Bodoni Moda",Georgia,serif;font-weight:700;font-size:clamp(3rem,13vw,6.5rem);line-height:.95;margin:0;letter-spacing:-.02em}
h1 em{font-weight:500;color:var(--rose)}
.lead{max-width:34ch;margin:18px 0 0;font-size:1.15rem;color:var(--soft)}
.tools{padding:22px 0 8px;display:grid;gap:14px}
.search{width:100%;padding:13px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.search:focus-visible,.pill:focus-visible,.order:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-size:.95rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--soft);font-size:.9rem;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 6px 18px;overflow:hidden;display:flex;flex-direction:column}
.shelf{height:210px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 72%,var(--glow,#6b2d5c) 0%,transparent 62%),linear-gradient(180deg,#140a1a,#2b1433)}.shelf svg{height:200px;width:auto;display:block}.shelf.photo{background:#fff;align-items:center}.shelf.photo img{height:100%;width:100%;object-fit:contain;padding:12px}


.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.brand{font-size:.85rem;color:var(--tone);font-weight:600;margin:0}
h2{font-family:"Bodoni Moda",Georgia,serif;font-size:1.35rem;line-height:1.15;margin:0;font-weight:700}
.tags{font-size:.85rem;color:var(--soft);margin:0}
.notes{margin:0;font-size:.95rem;flex:1}
.price{font-weight:600;margin:4px 0 0}
.order{display:block;text-align:center;text-decoration:none;background:var(--btn);color:var(--btnt);padding:11px;border-radius:12px;font-weight:600}
.empty{padding:40px 0;color:var(--soft)}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--soft);font-size:.9rem}
</style>
</head>

function hueOf(s){var h=0;for(var j=0;j<s.length;j++)h=(h*31+s.charCodeAt(j))%997;return HUES[h%8]}
function bottle(p,i,h){
  var s=p[2],g="g"+i,k="k"+i,body,cap,hl;
  if(s==="dis"){body='<rect x="32" y="64" width="56" height="82" rx="8" fill="url(#'+g+')"/><rect x="52" y="50" width="16" height="16" fill="#CBB27A"/>';cap='<rect x="46" y="22" width="28" height="30" rx="3" fill="url(#'+k+')"/>';hl='<rect x="38" y="70" width="6" height="70" rx="3" fill="#fff" opacity=".3"/>';}
  else if(s==="nic"){body='<rect x="38" y="52" width="44" height="94" rx="4" fill="url(#'+g+')"/>';cap='<rect x="44" y="26" width="32" height="28" rx="2" fill="url(#'+k+')"/>';hl='<rect x="43" y="58" width="5" height="82" rx="2.5" fill="#fff" opacity=".3"/>';}
  else{body='<circle cx="60" cy="106" r="38" fill="url(#'+g+')"/><rect x="54" y="58" width="12" height="14" fill="#CBB27A"/>';cap='<path d="M60 18 C73 32 75 46 67 60 L53 60 C45 46 47 32 60 18Z" fill="url(#'+k+')"/>';hl='<ellipse cx="43" cy="98" rx="5" ry="22" fill="#fff" opacity=".3"/>';}
  return '<svg viewBox="0 0 120 160" role="img" aria-label="Frasco '+esc(p[1])+'"><defs>'+

    '<linearGradient id="'+k+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3E2B0"/><stop offset="1" stop-color="#9A6B1E"/></linearGradient></defs>'+

    '<rect x="42" y="92" width="36" height="26" rx="2" fill="none" stroke="#E9D9A8" stroke-opacity=".8"/>'+

}
function render(){
  var list=P.filter(function(p){
    var hay=(p[0]+" "+p[1]+" "+p[4]+" "+p[5]).toLowerCase();
    return (st.sec==="todos"||p[2]===st.sec)&&(st.gen==="todos"||p[3]===st.gen)&&hay.indexOf(st.q)>-1;
  });
  document.getElementById("count").textContent=list.length+(list.length===1?" perfume":" perfumes");
  var g=document.getElementById("grid");
  if(!list.length){g.innerHTML='<p class="empty">No encontramos ese perfume. Escríbenos por WhatsApp y te lo conseguimos.</p>';return}
  g.innerHTML=list.map(function(p,i){
    var h=hueOf(p[0]+p[1]),k=p[0]+"|"+p[1];
    var msg=encodeURIComponent("Hola ParfumFZ, quiero pedir: "+p[0]+" "+p[1]);
    return '<article class="card" style="--tone:var('+SEC[p[2]][1]+')">'+
      (IMG[k]?'<div class="shelf photo"><img src="'+IMG[k]+'" alt="'+esc(p[0]+" "+p[1])+'"></div>':'<div class="shelf" style="--glow:hsl('+h+' 70% 38%)">'+bottle(p,i,h)+'</div>')+
      '<div class="body"><p class="brand">'+esc(p[0])+'</p><h2>'+esc(p[1])+'</h2>'+
      '<p class="tags">'+SEC[p[2]][0]+' · '+p[3]+' · '+esc(p[5])+'</p>'+
      '<p class="notes">'+esc(p[4])+'</p><p class="price">'+esc(p[6])+'</p>'+
      '<a class="order" href="https://wa.me/'+WA+'?text='+msg+'" target="_blank" rel="noopener">Pedir por WhatsApp</a></div></article>';
  }).join("");
}
